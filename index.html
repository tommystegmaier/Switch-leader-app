<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1420" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Team Hub" />
    <title>Team Hub</title>
    <script>
      // Apply dark mode before first paint to avoid a light flash.
      try {
        if (localStorage.getItem('th-dark') === '1') {
          var r = document.documentElement;
          r.classList.add('dark');
          r.style.setProperty('--th-bg', '#0f141b');
          r.style.setProperty('--th-surface', '#1b2129');
          r.style.setProperty('--th-text', '#e6e8ec');
          r.style.setProperty('--th-heading', '#f7f8fa');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
